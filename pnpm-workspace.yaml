# Only accept dependency versions published at least 2 days ago.
minimumReleaseAge: 2880

allowBuilds:
  # Git-hosted dep, so pnpm runs its `prepare` (rollup build). Keyed by repo,
  # not tarball hash: pnpm resolves codeload tarball URLs back to
  # `<name>@git+https://github.com/<owner>/<repo>.git`, so this covers any
  # commit digest Renovate pins in package.json. (Name-only keys are ignored
  # for git-hosted deps, since pnpm refuses to trust non-semver identities.)
  "@brave/leo@git+https://github.com/brave/leo.git": true
  # Transitive deps of leo. Leo declares its own allowBuilds, but pnpm reads
  # that setting only from the workspace root, so it does not carry over here.
  esbuild: true
  svelte-preprocess: true
